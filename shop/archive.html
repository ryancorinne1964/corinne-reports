<!DOCTYPE html><html><head><meta charset="utf-8"><title>Shop Reports — archive</title><style>body{font-family:Calibri,sans-serif;max-width:600px;margin:40px auto;color:#222}h1{font-family:Georgia,serif;color:#6B1D2A}a{color:#6B1D2A}</style></head><body>
<div id="report-content"><h1>Shop Reports</h1><p><a href="./">Latest</a></p><ul><li><a href="./Shop_Report_week_2026-08-31.html">week 2026-08-31</a></li><li><a href="./Shop_Report_week_2026-08-24.html">week 2026-08-24</a></li></ul></div>
<script>
(function() {
  var STORAGE_KEY = 'corinne_auth';
  function simpleHash(str) {
    var hash = 5381;
    for (var i = 0; i < str.length; i++) {
      hash = ((hash << 5) + hash) + str.charCodeAt(i);
      hash = hash & 0xFFFFFFFF;
    }
    return hash.toString(16);
  }
  var EXPECTED = '-53671d1d';
  function isAuthed() {
    try { return sessionStorage.getItem(STORAGE_KEY) === EXPECTED; } catch(e) { return false; }
  }
  function setAuthed() {
    try { sessionStorage.setItem(STORAGE_KEY, EXPECTED); } catch(e) {}
  }
  function showReport() {
    var overlay = document.getElementById('auth-overlay');
    var content = document.getElementById('report-content');
    if (overlay) overlay.style.display = 'none';
    if (content) content.style.display = 'block';
  }
  function buildOverlay() {
    var content = document.getElementById('report-content');
    if (content) content.style.display = 'none';
    var overlay = document.createElement('div');
    overlay.id = 'auth-overlay';
    overlay.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f9fafb;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;">' +
        '<div style="background:white;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.08);padding:48px;max-width:400px;width:90%;text-align:center;">' +
          '<div style="font-size:28px;margin-bottom:8px;">💎</div>' +
          '<h1 style="font-size:20px;color:#1f2937;margin-bottom:4px;">Corinne Jewelers</h1>' +
          '<p style="color:#6b7280;font-size:14px;margin-bottom:32px;">Enter your password to view reports</p>' +
          '<input type="password" id="auth-input" placeholder="Password" ' +
            'style="width:100%;padding:12px 16px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;margin-bottom:16px;outline:none;" ' +
            'onfocus="this.style.borderColor=\'#3b82f6\'" onblur="this.style.borderColor=\'#d1d5db\'">' +
          '<button id="auth-btn" ' +
            'style="width:100%;padding:12px;background:#1f2937;color:white;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;" ' +
            'onmouseover="this.style.background=\'#374151\'" onmouseout="this.style.background=\'#1f2937\'">' +
            'View Report</button>' +
          '<p id="auth-error" style="color:#ef4444;font-size:13px;margin-top:12px;display:none;">Incorrect password. Please try again.</p>' +
        '</div>' +
      '</div>';
    document.body.insertBefore(overlay, document.body.firstChild);
    var input = document.getElementById('auth-input');
    var btn = document.getElementById('auth-btn');
    var error = document.getElementById('auth-error');
    function tryAuth() {
      if (simpleHash(input.value) === EXPECTED) { setAuthed(); showReport(); }
      else { error.style.display = 'block'; input.style.borderColor = '#ef4444'; input.value = ''; input.focus(); }
    }
    btn.addEventListener('click', tryAuth);
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') tryAuth(); });
    setTimeout(function() { input.focus(); }, 100);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { isAuthed() ? showReport() : buildOverlay(); });
  } else { isAuthed() ? showReport() : buildOverlay(); }
})();
</script>
</body></html>
